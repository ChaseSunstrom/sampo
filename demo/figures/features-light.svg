<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1218" width="880" height="1218" role="img" aria-label="Features: a table of 14 rows (What you get, Try): Plans; Knows your stack; Verifies; Shows what happened; Runs unattended; Learns a fix once; Changes many spots; Improves itself; Proves migrations, data and releases; Runs incidents; Checks infra files; Finds problems unasked; Improves itself, per aspect; Stays light. Its text follows">
<title>Features: a table of 14 rows (What you get, Try): Plans; Knows your stack; Verifies; Shows what happened; Runs unattended; Learns a fix once; Changes many spots; Improves itself; Proves migrations, data and releases; Runs incidents; Checks infra files; Finds problems unasked; Improves itself, per aspect; Stays light. Its text follows</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#46526a}.b{font-weight:600;fill:#0f1722}.i{fill:#0f1722}.d{fill:#5b6679}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;letter-spacing:.08em}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f1722}.k{fill:#5a45d0;fill-opacity:.11;stroke:#5a45d0;stroke-opacity:.38}</style>
<rect x="0.5" y="0.5" width="879" height="1217" fill="#f6f7f9" stroke="#d5dce7"/>
<rect x="1" y="1" width="878" height="37" fill="#ffffff"/>
<path d="M0.5 38H879.5M0.5 66H879.5" stroke="#d5dce7"/>
<rect x="14" y="11" width="24.4" height="17" fill="#5a45d0"/>
<text x="19" y="23.5" font-size="11" class="h" style="fill:#ffffff">05</text>
<text x="50.4" y="23.5" font-size="11.5" class="h i">FEATURES</text>
<text x="864" y="23.5" font-size="10.5" class="h" text-anchor="end" style="fill:#5a45d0">14 ROWS</text>
<text x="46" y="56" font-size="10" class="h d"></text>
<text x="279.1" y="56" font-size="10" class="h d">WHAT YOU GET</text>
<text x="628.4" y="56" font-size="10" class="h d">TRY</text>
<text x="14" y="91.5" font-size="10.5" class="h d">01</text>
<text x="46" y="92" font-size="14" class="b" xml:space="preserve">Plans</text>
<text x="279.1" y="92" font-size="14" xml:space="preserve">Briefs with type, tier, criteria and steps; M and L</text>
<text x="279.1" y="112" font-size="14" xml:space="preserve">work lists approaches first; the queue orders</text>
<text x="279.1" y="132" font-size="14" xml:space="preserve">itself</text>
<rect x="628.4" y="77.9" width="91.2" height="18.6" rx="3" class="k"/>
<text x="632.4" y="91.5" font-size="12.6" textLength="83.2" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo queue</text>
<rect x="1" y="148" width="878" height="62" fill="#ffffff"/>
<path d="M14 148H864" stroke="#e8ecf2"/>
<text x="14" y="173.5" font-size="10.5" class="h d">02</text>
<text x="46" y="174" font-size="14" class="b" xml:space="preserve">Knows your stack</text>
<text x="279.1" y="174" font-size="14" xml:space="preserve">Over 1,000 stack cards in 29 areas; a card&#x27;s</text>
<text x="279.1" y="194" font-size="14" xml:space="preserve">pitfalls arrive with the first edit of a file it covers</text>
<rect x="628.4" y="159.9" width="76" height="18.6" rx="3" class="k"/>
<text x="632.4" y="173.5" font-size="12.6" textLength="68" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo lib</text>
<path d="M14 210H864" stroke="#e8ecf2"/>
<text x="14" y="235.5" font-size="10.5" class="h d">03</text>
<text x="46" y="236" font-size="14" class="b" xml:space="preserve">Verifies</text>
<text x="279.1" y="236" font-size="14" xml:space="preserve">Gates that reuse a pass on an identical tree; a fix</text>
<text x="279.1" y="256" font-size="14" xml:space="preserve">needs a test that failed first</text>
<rect x="628.4" y="221.9" width="91.2" height="18.6" rx="3" class="k"/>
<text x="632.4" y="235.5" font-size="12.6" textLength="83.2" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo check</text>
<text x="725.2" y="236" font-size="14" xml:space="preserve">·</text>
<rect x="628.4" y="241.9" width="129" height="18.6" rx="3" class="k"/>
<text x="632.4" y="255.5" font-size="12.6" textLength="121" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo task prove</text>
<rect x="1" y="272" width="878" height="62" fill="#ffffff"/>
<path d="M14 272H864" stroke="#e8ecf2"/>
<text x="14" y="297.5" font-size="10.5" class="h d">04</text>
<text x="46" y="298" font-size="14" class="b" xml:space="preserve">Shows what happened</text>
<text x="279.1" y="298" font-size="14" xml:space="preserve">A branch ranked by review risk; any line traced</text>
<text x="279.1" y="318" font-size="14" xml:space="preserve">back to the words you asked in</text>
<rect x="628.4" y="283.9" width="83.6" height="18.6" rx="3" class="k"/>
<text x="632.4" y="297.5" font-size="12.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo tour</text>
<text x="717.6" y="298" font-size="14" textLength="3.8" lengthAdjust="spacing" xml:space="preserve">·</text>
<rect x="727" y="283.9" width="76" height="18.6" rx="3" class="k"/>
<text x="731" y="297.5" font-size="12.6" textLength="68" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo why</text>
<path d="M14 334H864" stroke="#e8ecf2"/>
<text x="14" y="359.5" font-size="10.5" class="h d">05</text>
<text x="46" y="360" font-size="14" class="b" xml:space="preserve">Runs unattended</text>
<text x="279.1" y="360" font-size="14" xml:space="preserve">Drive mode, full auto, one fresh session per task,</text>
<text x="279.1" y="380" font-size="14" xml:space="preserve">budgeted nightly jobs</text>
<rect x="628.4" y="345.9" width="76" height="18.6" rx="3" class="k"/>
<text x="632.4" y="359.5" font-size="12.6" textLength="68" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo run</text>
<text x="710" y="360" font-size="14" textLength="3.8" lengthAdjust="spacing" xml:space="preserve">·</text>
<rect x="719.4" y="345.9" width="91.2" height="18.6" rx="3" class="k"/>
<text x="723.4" y="359.5" font-size="12.6" textLength="83.2" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo night</text>
<rect x="1" y="396" width="878" height="62" fill="#ffffff"/>
<path d="M14 396H864" stroke="#e8ecf2"/>
<text x="14" y="421.5" font-size="10.5" class="h d">06</text>
<text x="46" y="422" font-size="14" class="b" xml:space="preserve">Learns a fix once</text>
<text x="279.1" y="422" font-size="14" xml:space="preserve">A failure that was fixed before gets its fix offered</text>
<text x="279.1" y="442" font-size="14" xml:space="preserve">next time, in any project</text>
<rect x="628.4" y="407.9" width="113.8" height="18.6" rx="3" class="k"/>
<text x="632.4" y="421.5" font-size="12.6" textLength="105.8" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo fix list</text>
<path d="M14 458H864" stroke="#e8ecf2"/>
<text x="14" y="483.5" font-size="10.5" class="h d">07</text>
<text x="46" y="484" font-size="14" class="b" xml:space="preserve">Changes many spots</text>
<text x="279.1" y="484" font-size="14" xml:space="preserve">Batches of exact replacements, applied all or</text>
<text x="279.1" y="504" font-size="14" xml:space="preserve">none, inside the task&#x27;s scope</text>
<rect x="628.4" y="469.9" width="83.6" height="18.6" rx="3" class="k"/>
<text x="632.4" y="483.5" font-size="12.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo edit</text>
<text x="717.6" y="484" font-size="14" textLength="3.8" lengthAdjust="spacing" xml:space="preserve">·</text>
<rect x="727" y="469.9" width="76" height="18.6" rx="3" class="k"/>
<text x="731" y="483.5" font-size="12.6" textLength="68" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo sub</text>
<rect x="1" y="520" width="878" height="62" fill="#ffffff"/>
<path d="M14 520H864" stroke="#e8ecf2"/>
<text x="14" y="545.5" font-size="10.5" class="h d">08</text>
<text x="46" y="546" font-size="14" class="b" xml:space="preserve">Improves itself</text>
<text x="279.1" y="546" font-size="14" xml:space="preserve">Rule changes backtested on your real sessions;</text>
<text x="279.1" y="566" font-size="14" xml:space="preserve">self-improvement kept only when evals agree</text>
<rect x="628.4" y="531.9" width="113.8" height="18.6" rx="3" class="k"/>
<text x="632.4" y="545.5" font-size="12.6" textLength="105.8" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">/sampo:improve</text>
<path d="M14 582H864" stroke="#e8ecf2"/>
<text x="14" y="607.5" font-size="10.5" class="h d">09</text>
<text x="46" y="608" font-size="14" class="b" xml:space="preserve">Proves migrations, data and</text>
<text x="46" y="628" font-size="14" class="b" xml:space="preserve">releases</text>
<text x="279.1" y="608" font-size="14" xml:space="preserve">Migrations up, down, up on a throwaway</text>
<text x="279.1" y="628" font-size="14" xml:space="preserve">database; data commands on a copy, invariants</text>
<text x="279.1" y="648" font-size="14" xml:space="preserve">checked; the release built offline, run from a</text>
<text x="279.1" y="668" font-size="14" textLength="188" lengthAdjust="spacing" xml:space="preserve">throwaway prefix, tagged by</text>
<rect x="472.7" y="653.9" width="121.4" height="18.6" rx="3" class="k"/>
<text x="476.7" y="667.5" font-size="12.6" textLength="113.4" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo release V</text>
<text x="279.1" y="688" font-size="14" xml:space="preserve">in any repo</text>
<rect x="628.4" y="593.9" width="181.9" height="18.6" rx="3" class="k"/>
<text x="632.4" y="607.5" font-size="12.6" textLength="173.9" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo prove --migration</text>
<text x="812.2" y="608" font-size="14" xml:space="preserve">,</text>
<rect x="628.4" y="613.9" width="53.4" height="18.6" rx="3" class="k"/>
<text x="632.4" y="627.5" font-size="12.6" textLength="45.4" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">--data</text>
<text x="683.7" y="628" font-size="14" textLength="3.8" lengthAdjust="spacing" xml:space="preserve">,</text>
<rect x="693.1" y="613.9" width="76" height="18.6" rx="3" class="k"/>
<text x="697.1" y="627.5" font-size="12.6" textLength="68" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">--release</text>
<rect x="1" y="704" width="878" height="142" fill="#ffffff"/>
<path d="M14 704H864" stroke="#e8ecf2"/>
<text x="14" y="729.5" font-size="10.5" class="h d">10</text>
<text x="46" y="730" font-size="14" class="b" xml:space="preserve">Runs incidents</text>
<rect x="279.1" y="715.9" width="272.6" height="18.6" rx="3" class="k"/>
<text x="283.1" y="729.5" font-size="12.6" textLength="264.6" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo capture --incident &#x27;&lt;impact&gt;&#x27;</text>
<rect x="279.1" y="735.9" width="98.7" height="18.6" rx="3" class="k"/>
<text x="283.1" y="749.5" font-size="12.6" textLength="90.7" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">--signal CMD</text>
<text x="383.5" y="750" font-size="14" xml:space="preserve">opens an urgent FIX only when</text>
<text x="279.1" y="770" font-size="14" xml:space="preserve">the harm signal is red, keeps a UTC timeline,</text>
<text x="279.1" y="790" font-size="14" xml:space="preserve">closes only on the same signal green twice plus</text>
<text x="279.1" y="810" font-size="14" xml:space="preserve">one follow-up, and leaves the signal for</text>
<rect x="279.1" y="815.9" width="113.8" height="18.6" rx="3" class="k"/>
<text x="283.1" y="829.5" font-size="12.6" textLength="105.8" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo sentinel</text>
<rect x="628.4" y="715.9" width="189.4" height="18.6" rx="3" class="k"/>
<text x="632.4" y="729.5" font-size="12.6" textLength="181.4" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo capture --incident</text>
<path d="M14 846H864" stroke="#e8ecf2"/>
<text x="14" y="871.5" font-size="10.5" class="h d">11</text>
<text x="46" y="872" font-size="14" class="b" xml:space="preserve">Checks infra files</text>
<text x="279.1" y="872" font-size="14" xml:space="preserve">Dockerfiles, compose, Terraform, Helm,</text>
<text x="279.1" y="892" font-size="14" xml:space="preserve">Kubernetes, CI workflows, shell, systemd units:</text>
<text x="279.1" y="912" font-size="14" xml:space="preserve">each through its own validator on a copy, offline;</text>
<text x="279.1" y="932" font-size="14" xml:space="preserve">no validator installed, unproven</text>
<rect x="628.4" y="857.9" width="151.6" height="18.6" rx="3" class="k"/>
<text x="632.4" y="871.5" font-size="12.6" textLength="143.6" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo prove --infra</text>
<rect x="1" y="948" width="878" height="102" fill="#ffffff"/>
<path d="M14 948H864" stroke="#e8ecf2"/>
<text x="14" y="973.5" font-size="10.5" class="h d">12</text>
<text x="46" y="974" font-size="14" class="b" xml:space="preserve">Finds problems unasked</text>
<text x="279.1" y="974" font-size="14" xml:space="preserve">Untested code, undeclared imports, SQL built</text>
<text x="279.1" y="994" font-size="14" xml:space="preserve">from input, slow loops, flaky tests, stale docs,</text>
<text x="279.1" y="1014" font-size="14" xml:space="preserve">leaked keys: no model, worst first; proven on a</text>
<text x="279.1" y="1034" font-size="14" xml:space="preserve">copy</text>
<rect x="628.4" y="959.9" width="219.7" height="18.6" rx="3" class="k"/>
<text x="632.4" y="973.5" font-size="12.6" textLength="211.7" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo find --rank [--ladder]</text>
<text x="628.4" y="994" font-size="14" xml:space="preserve">(tools: trusted only),</text>
<rect x="628.4" y="999.9" width="181.9" height="18.6" rx="3" class="k"/>
<text x="632.4" y="1013.5" font-size="12.6" textLength="173.9" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo prove --capture N</text>
<text x="812.2" y="1014" font-size="14" xml:space="preserve">/</text>
<rect x="628.4" y="1019.9" width="53.4" height="18.6" rx="3" class="k"/>
<text x="632.4" y="1033.5" font-size="12.6" textLength="45.4" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">--docs</text>
<text x="683.7" y="1034" font-size="14" textLength="3.8" lengthAdjust="spacing" xml:space="preserve">,</text>
<rect x="693.1" y="1019.9" width="136.5" height="18.6" rx="3" class="k"/>
<text x="697.1" y="1033.5" font-size="12.6" textLength="128.5" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">/sampo:initiative</text>
<path d="M14 1050H864" stroke="#e8ecf2"/>
<text x="14" y="1075.5" font-size="10.5" class="h d">13</text>
<text x="46" y="1076" font-size="14" class="b" xml:space="preserve">Improves itself, per aspect</text>
<text x="279.1" y="1076" font-size="14" xml:space="preserve">Kalevala: a Rune tower per aspect, generations</text>
<text x="279.1" y="1096" font-size="14" xml:space="preserve">toward one goal you write; a rewrite stays only if</text>
<text x="279.1" y="1116" font-size="14" xml:space="preserve">it closed more exam scenarios</text>
<rect x="628.4" y="1061.9" width="166.8" height="18.6" rx="3" class="k"/>
<text x="632.4" y="1075.5" font-size="12.6" textLength="158.8" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo kalevala status</text>
<text x="800.8" y="1076" font-size="14" xml:space="preserve">·</text>
<rect x="628.4" y="1081.9" width="121.4" height="18.6" rx="3" class="k"/>
<text x="632.4" y="1095.5" font-size="12.6" textLength="113.4" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo rune step</text>
<rect x="1" y="1132" width="878" height="82" fill="#ffffff"/>
<path d="M14 1132H864" stroke="#e8ecf2"/>
<text x="14" y="1157.5" font-size="10.5" class="h d">14</text>
<text x="46" y="1158" font-size="14" class="b" xml:space="preserve">Stays light</text>
<text x="279.1" y="1158" font-size="14" xml:space="preserve">Only the Ward and write validators run in line;</text>
<text x="279.1" y="1178" font-size="14" xml:space="preserve">every hook call stays under its budget (the chart</text>
<text x="279.1" y="1198" font-size="14" xml:space="preserve">below)</text>
<rect x="628.4" y="1143.9" width="98.7" height="18.6" rx="3" class="k"/>
<text x="632.4" y="1157.5" font-size="12.6" textLength="90.7" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo doctor</text>
<path d="M1 13V1H13M867 1217H879V1205" fill="none" stroke="#0a86b0" stroke-width="2"/>
</svg>
