<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 298" width="880" height="298" role="img" aria-label="Talking to it: a table of 4 rows (You say, What happens): NOW: · PAUSE · STATUS; &quot;super improve it&quot;; FULL AUTO; &quot;is sampo ok?&quot; · &quot;clean up&quot; · &quot;this repo is sensitive&quot;. Its text follows">
<title>Talking to it: a table of 4 rows (You say, What happens): NOW: · PAUSE · STATUS; &quot;super improve it&quot;; FULL AUTO; &quot;is sampo ok?&quot; · &quot;clean up&quot; · &quot;this repo is sensitive&quot;. Its text follows</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#98a4ba}.b{font-weight:600;fill:#d6deeb}.i{fill:#d6deeb}.d{fill:#717e97}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;letter-spacing:.08em}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5ee6a0}.k{fill:#5ee6a0;fill-opacity:.13;stroke:#5ee6a0;stroke-opacity:.28}</style>
<rect x="0.5" y="0.5" width="879" height="297" fill="#0a0e16" stroke="#1c2433"/>
