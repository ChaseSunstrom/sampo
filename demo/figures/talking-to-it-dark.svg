<text x="19" y="23.5" font-size="11" class="h" style="fill:#0a0e16">03</text>
<text x="50.4" y="23.5" font-size="11.5" class="h i">TALKING TO IT</text>
<text x="864" y="23.5" font-size="10.5" class="h" text-anchor="end" style="fill:#5ee6a0">4 ROWS</text>
<text x="46" y="56" font-size="10" class="h d">YOU SAY</text>
<text x="360.9" y="56" font-size="10" class="h d">WHAT HAPPENS</text>
<text x="14" y="91.5" font-size="10.5" class="h d">01</text>
<rect x="46" y="77.9" width="38.2" height="18.6" rx="3" class="k"/>
<text x="50" y="91.5" font-size="12.6" textLength="30.2" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">NOW:</text>
<text x="89.9" y="92" font-size="14" class="b" textLength="3.9" lengthAdjust="spacing" xml:space="preserve">·</text>
<rect x="99.5" y="77.9" width="45.8" height="18.6" rx="3" class="k"/>
<text x="103.5" y="91.5" font-size="12.6" textLength="37.8" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">PAUSE</text>
<text x="150.9" y="92" font-size="14" class="b" textLength="3.9" lengthAdjust="spacing" xml:space="preserve">·</text>
<rect x="160.5" y="77.9" width="53.4" height="18.6" rx="3" class="k"/>
<text x="164.5" y="91.5" font-size="12.6" textLength="45.4" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">STATUS</text>
<text x="360.9" y="92" font-size="14" xml:space="preserve">switch tasks on purpose · checkpoint · where things stand</text>
<rect x="1" y="108" width="878" height="62" fill="#0e1420"/>
<path d="M14 108H864" stroke="#141b28"/>
<text x="14" y="133.5" font-size="10.5" class="h d">02</text>
<text x="46" y="134" font-size="14" class="b" xml:space="preserve">&quot;super improve it&quot;</text>
<text x="360.9" y="134" font-size="14" xml:space="preserve">a brainstorm first: each idea checked against the real code, the best ones</text>
<text x="360.9" y="154" font-size="14" xml:space="preserve">queued</text>
<path d="M14 170H864" stroke="#141b28"/>
<text x="14" y="195.5" font-size="10.5" class="h d">03</text>
<rect x="46" y="181.9" width="76" height="18.6" rx="3" class="k"/>
<text x="50" y="195.5" font-size="12.6" textLength="68" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">FULL AUTO</text>
<text x="360.9" y="196" font-size="14" xml:space="preserve">the whole queue without questions; decisions recorded, one summary at</text>
<text x="360.9" y="216" font-size="14" textLength="58.2" lengthAdjust="spacing" xml:space="preserve">the end (</text>
<rect x="421.2" y="201.9" width="136.5" height="18.6" rx="3" class="k"/>
<text x="425.2" y="215.5" font-size="12.6" textLength="128.5" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">STANDARD AUTONOMY</text>
<text x="563.3" y="216" font-size="14" xml:space="preserve">switches back)</text>
<rect x="1" y="232" width="878" height="62" fill="#0e1420"/>
<path d="M14 232H864" stroke="#141b28"/>
<text x="14" y="257.5" font-size="10.5" class="h d">04</text>
<text x="46" y="258" font-size="14" class="b" xml:space="preserve">&quot;is sampo ok?&quot; · &quot;clean up&quot; · &quot;this repo is</text>
<text x="46" y="278" font-size="14" class="b" xml:space="preserve">sensitive&quot;</text>
<text x="360.9" y="258" font-size="14" textLength="78.9" lengthAdjust="spacing" xml:space="preserve">Claude runs</text>
<rect x="445.5" y="243.9" width="98.7" height="18.6" rx="3" class="k"/>
<text x="449.5" y="257.5" font-size="12.6" textLength="90.7" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo doctor</text>
<text x="546.2" y="258" font-size="14" textLength="3.8" lengthAdjust="spacing" xml:space="preserve">,</text>
<rect x="555.6" y="243.9" width="83.6" height="18.6" rx="3" class="k"/>
<text x="559.6" y="257.5" font-size="12.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo tidy</text>
<text x="644.8" y="258" font-size="14" textLength="14.3" lengthAdjust="spacing" xml:space="preserve">or</text>
<rect x="664.7" y="243.9" width="144.1" height="18.6" rx="3" class="k"/>
<text x="668.7" y="257.5" font-size="12.6" textLength="136.1" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo sensitive on</text>
<text x="810.8" y="258" font-size="14" xml:space="preserve">. You</text>
<text x="360.9" y="278" font-size="14" xml:space="preserve">never have to type a command.</text>
