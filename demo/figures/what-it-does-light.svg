<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 628" width="880" height="628" role="img" aria-label="What it does: a table of 9 rows (Sampo, So that): Finds the work; Plans before it edits; Builds in parallel; Lands in one gate run; Proves it; Ships it; Improves itself; Guards bypass mode; Stays cheap. Its text follows">
<title>What it does: a table of 9 rows (Sampo, So that): Finds the work; Plans before it edits; Builds in parallel; Lands in one gate run; Proves it; Ships it; Improves itself; Guards bypass mode; Stays cheap. Its text follows</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#46526a}.b{font-weight:600;fill:#0f1722}.i{fill:#0f1722}.d{fill:#5b6679}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;letter-spacing:.08em}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f1722}.k{fill:#0a7ea8;fill-opacity:.11;stroke:#0a7ea8;stroke-opacity:.38}</style>
<rect x="0.5" y="0.5" width="879" height="627" fill="#f6f7f9" stroke="#d5dce7"/>
<rect x="1" y="1" width="878" height="37" fill="#ffffff"/>
<path d="M0.5 38H879.5M0.5 66H879.5" stroke="#d5dce7"/>
<rect x="14" y="11" width="24.4" height="17" fill="#0a7ea8"/>
<text x="19" y="23.5" font-size="11" class="h" style="fill:#ffffff">01</text>
<text x="50.4" y="23.5" font-size="11.5" class="h i">WHAT IT DOES</text>
<text x="864" y="23.5" font-size="10.5" class="h" text-anchor="end" style="fill:#0a7ea8">9 ROWS</text>
<text x="46" y="56" font-size="10" class="h d">SAMPO</text>
<text x="219.4" y="56" font-size="10" class="h d">SO THAT</text>
<text x="14" y="91.5" font-size="10.5" class="h d">01</text>
<text x="46" y="92" font-size="14" class="b" xml:space="preserve">Finds the work</text>
<rect x="219.4" y="77.9" width="83.6" height="18.6" rx="3" class="k"/>
<text x="223.4" y="91.5" font-size="12.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo find</text>
<text x="308.6" y="92" font-size="14" xml:space="preserve">ranks bugs, untested code, slow paths and stale docs with no model;</text>
<rect x="219.4" y="97.9" width="91.2" height="18.6" rx="3" class="k"/>
<text x="223.4" y="111.5" font-size="12.6" textLength="83.2" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo scout</text>
<text x="316.2" y="112" font-size="14" xml:space="preserve">files work nobody asked for. Plain words work too.</text>
<rect x="1" y="128" width="878" height="62" fill="#ffffff"/>
<path d="M14 128H864" stroke="#e8ecf2"/>
<text x="14" y="153.5" font-size="10.5" class="h d">02</text>
<text x="46" y="154" font-size="14" class="b" xml:space="preserve">Plans before it edits</text>
<text x="219.4" y="154" font-size="14" xml:space="preserve">Every request becomes a brief: type, size, what done means and the command that proves it. No</text>
<text x="219.4" y="174" font-size="14" xml:space="preserve">brief, no edit.</text>
<path d="M14 190H864" stroke="#e8ecf2"/>
<text x="14" y="215.5" font-size="10.5" class="h d">03</text>
<text x="46" y="216" font-size="14" class="b" xml:space="preserve">Builds in parallel</text>
<text x="219.4" y="216" font-size="14" xml:space="preserve">Each task gets a lane: its own git worktree and a builder agent that writes the failing test first.</text>
<rect x="219.4" y="221.9" width="113.8" height="18.6" rx="3" class="k"/>
<text x="223.4" y="235.5" font-size="12.6" textLength="105.8" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo lane max</text>
<text x="338.8" y="236" font-size="14" xml:space="preserve">sets how many run at once.</text>
<rect x="1" y="252" width="878" height="62" fill="#ffffff"/>
<path d="M14 252H864" stroke="#e8ecf2"/>
<text x="14" y="277.5" font-size="10.5" class="h d">04</text>
<text x="46" y="278" font-size="14" class="b" xml:space="preserve">Lands in one gate run</text>
<text x="219.4" y="278" font-size="14" xml:space="preserve">The merge train takes up to 8 finished lanes, runs the tests they reach once, names a red run&#x27;s</text>
<text x="219.4" y="298" font-size="14" xml:space="preserve">culprit and lands the rest.</text>
<path d="M14 314H864" stroke="#e8ecf2"/>
<text x="14" y="339.5" font-size="10.5" class="h d">05</text>
<text x="46" y="340" font-size="14" class="b" xml:space="preserve">Proves it</text>
<text x="219.4" y="340" font-size="14" xml:space="preserve">Evidence is a command Sampo ran and recorded, never a sentence. Nothing closes without its</text>
<text x="219.4" y="360" font-size="14" xml:space="preserve">audits.</text>
<rect x="1" y="376" width="878" height="62" fill="#ffffff"/>
<path d="M14 376H864" stroke="#e8ecf2"/>
<text x="14" y="401.5" font-size="10.5" class="h d">06</text>
<text x="46" y="402" font-size="14" class="b" xml:space="preserve">Ships it</text>
<text x="219.4" y="402" font-size="14" textLength="209" lengthAdjust="spacing" xml:space="preserve">Green work fast-forwards main;</text>
<rect x="434" y="387.9" width="83.6" height="18.6" rx="3" class="k"/>
<text x="438" y="401.5" font-size="12.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo ship</text>
<text x="523.2" y="402" font-size="14" textLength="88.3" lengthAdjust="spacing" xml:space="preserve">pushes it and</text>
<rect x="617.2" y="387.9" width="113.8" height="18.6" rx="3" class="k"/>
<text x="621.2" y="401.5" font-size="12.6" textLength="105.8" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo ci-watch</text>
<text x="736.6" y="402" font-size="14" xml:space="preserve">turns a red CI run</text>
<text x="219.4" y="422" font-size="14" xml:space="preserve">into a fix task.</text>
<path d="M14 438H864" stroke="#e8ecf2"/>
<text x="14" y="463.5" font-size="10.5" class="h d">07</text>
<text x="46" y="464" font-size="14" class="b" xml:space="preserve">Improves itself</text>
<text x="219.4" y="464" font-size="14" xml:space="preserve">Kalevala runs a Rune tower per aspect that rewrites its own process each generation, kept only</text>
<text x="219.4" y="484" font-size="14" xml:space="preserve">when it scores better on the exam.</text>
<rect x="1" y="500" width="878" height="62" fill="#ffffff"/>
<path d="M14 500H864" stroke="#e8ecf2"/>
<text x="14" y="525.5" font-size="10.5" class="h d">08</text>
<text x="46" y="526" font-size="14" class="b" xml:space="preserve">Guards bypass mode</text>
<text x="219.4" y="526" font-size="14" textLength="478.3" lengthAdjust="spacing" xml:space="preserve">A fail-closed Ward stops wide deletes, force-pushes, credential reads and</text>
<rect x="703.3" y="511.9" width="76" height="18.6" rx="3" class="k"/>
<text x="707.3" y="525.5" font-size="12.6" textLength="68" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">curl | sh</text>
<text x="781.3" y="526" font-size="14" xml:space="preserve">, and</text>
<text x="219.4" y="546" font-size="14" xml:space="preserve">snapshots work before git throws it away.</text>
<path d="M14 562H864" stroke="#e8ecf2"/>
<text x="14" y="587.5" font-size="10.5" class="h d">09</text>
<text x="46" y="588" font-size="14" class="b" xml:space="preserve">Stays cheap</text>
<text x="219.4" y="588" font-size="14" xml:space="preserve">A rule before a local model, a local model before a cloud one; only the tests a change reaches;</text>
<text x="219.4" y="608" font-size="14" textLength="205.8" lengthAdjust="spacing" xml:space="preserve">hooks under their time budget;</text>
<rect x="430.8" y="593.9" width="98.7" height="18.6" rx="3" class="k"/>
<text x="434.8" y="607.5" font-size="12.6" textLength="90.7" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo budget</text>
<text x="535.1" y="608" font-size="14" xml:space="preserve">caps spend.</text>
<path d="M1 13V1H13M867 627H879V615" fill="none" stroke="#0a86b0" stroke-width="2"/>
</svg>
