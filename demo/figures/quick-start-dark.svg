<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 318" width="880" height="318" role="img" aria-label="Quick start: a table of 4 rows (Then, How): Ask for something; Watch it first; See where things stand; Let it run. Its text follows">
<title>Quick start: a table of 4 rows (Then, How): Ask for something; Watch it first; See where things stand; Let it run. Its text follows</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#98a4ba}.b{font-weight:600;fill:#d6deeb}.i{fill:#d6deeb}.d{fill:#717e97}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;letter-spacing:.08em}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f5c84c}.k{fill:#f5c84c;fill-opacity:.13;stroke:#f5c84c;stroke-opacity:.28}</style>
<rect x="0.5" y="0.5" width="879" height="317" fill="#0a0e16" stroke="#1c2433"/>
<rect x="1" y="1" width="878" height="37" fill="#0e1420"/>
<path d="M0.5 38H879.5M0.5 66H879.5" stroke="#1c2433"/>
<rect x="14" y="11" width="24.4" height="17" fill="#f5c84c"/>
<text x="19" y="23.5" font-size="11" class="h" style="fill:#0a0e16">02</text>
<text x="50.4" y="23.5" font-size="11.5" class="h i">QUICK START</text>
<text x="864" y="23.5" font-size="10.5" class="h" text-anchor="end" style="fill:#f5c84c">4 ROWS</text>
<text x="46" y="56" font-size="10" class="h d">THEN</text>
<text x="231.2" y="56" font-size="10" class="h d">HOW</text>
<text x="14" y="91.5" font-size="10.5" class="h d">01</text>
<text x="46" y="92" font-size="14" class="b" xml:space="preserve">Ask for something</text>
<rect x="231.2" y="77.9" width="265" height="18.6" rx="3" class="k"/>
<text x="235.2" y="91.5" font-size="12.6" textLength="257" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">fix the login timeout on slow wifi</text>
<text x="498.2" y="92" font-size="14" xml:space="preserve">, in plain words. That&#x27;s the whole interface.</text>
<rect x="1" y="108" width="878" height="62" fill="#0e1420"/>
<path d="M14 108H864" stroke="#141b28"/>
<text x="14" y="133.5" font-size="10.5" class="h d">02</text>
<text x="46" y="134" font-size="14" class="b" xml:space="preserve">Watch it first</text>
<rect x="231.2" y="119.9" width="83.6" height="18.6" rx="3" class="k"/>
<text x="235.2" y="133.5" font-size="12.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo demo</text>
<text x="320.4" y="134" font-size="14" textLength="83.8" lengthAdjust="spacing" xml:space="preserve">runs the real</text>
<rect x="409.9" y="119.9" width="45.8" height="18.6" rx="3" class="k"/>
<text x="413.9" y="133.5" font-size="12.6" textLength="37.8" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo</text>
<text x="461.3" y="134" font-size="14" xml:space="preserve">and Ward hook on a seeded bug in a throwaway repo: no</text>
<text x="231.2" y="154" font-size="14" xml:space="preserve">model calls, nothing left behind.</text>
<path d="M14 170H864" stroke="#141b28"/>
<text x="14" y="195.5" font-size="10.5" class="h d">03</text>
<text x="46" y="196" font-size="14" class="b" xml:space="preserve">See where things stand</text>
<text x="231.2" y="196" font-size="14" textLength="30.6" lengthAdjust="spacing" xml:space="preserve">Bare</text>
<rect x="267.5" y="181.9" width="45.8" height="18.6" rx="3" class="k"/>
<text x="271.5" y="195.5" font-size="12.6" textLength="37.8" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo</text>
<text x="318.9" y="196" font-size="14" textLength="188" lengthAdjust="spacing" xml:space="preserve">in a project says what&#x27;s next;</text>
<rect x="512.6" y="181.9" width="83.6" height="18.6" rx="3" class="k"/>
<text x="516.6" y="195.5" font-size="12.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo help</text>
<text x="601.8" y="196" font-size="14" xml:space="preserve">answers &quot;can it…?&quot; in plain words;</text>
<rect x="231.2" y="201.9" width="129" height="18.6" rx="3" class="k"/>
<text x="235.2" y="215.5" font-size="12.6" textLength="121" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo which NEED</text>
<text x="365.8" y="216" font-size="14" xml:space="preserve">searches past fixes, your tools, MCP servers, binaries, skills and plugins at</text>
<text x="231.2" y="236" font-size="14" xml:space="preserve">once, and says which hits need a grant.</text>
<rect x="1" y="252" width="878" height="62" fill="#0e1420"/>
<path d="M14 252H864" stroke="#141b28"/>
<text x="14" y="277.5" font-size="10.5" class="h d">04</text>
<text x="46" y="278" font-size="14" class="b" xml:space="preserve">Let it run</text>
<text x="231.2" y="278" font-size="14" textLength="22.7" lengthAdjust="spacing" xml:space="preserve">Say</text>
<rect x="259.5" y="263.9" width="76" height="18.6" rx="3" class="k"/>
<text x="263.5" y="277.5" font-size="12.6" textLength="68" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">FULL AUTO</text>
<text x="337.5" y="278" font-size="14" textLength="370.2" lengthAdjust="spacing" xml:space="preserve">: it works the whole queue, then finds its own next work.</text>
<rect x="713.4" y="263.9" width="136.5" height="18.6" rx="3" class="k"/>
<text x="717.4" y="277.5" font-size="12.6" textLength="128.5" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo watch --web</text>
<text x="231.2" y="298" font-size="14" textLength="112.8" lengthAdjust="spacing" xml:space="preserve">opens the Board;</text>
<rect x="349.6" y="283.9" width="113.8" height="18.6" rx="3" class="k"/>
<text x="353.6" y="297.5" font-size="12.6" textLength="105.8" lengthAdjust="spacingAndGlyphs" class="c" xml:space="preserve">sampo lane max</text>
<text x="469.1" y="298" font-size="14" xml:space="preserve">sets how many builders run at once.</text>
<path d="M1 13V1H13M867 317H879V305" fill="none" stroke="#4cc9f0" stroke-width="2"/>
</svg>
