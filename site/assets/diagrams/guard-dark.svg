<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img">
<title>The Ward, Sampo's guard: every command passes the Ward first; most run, ones that would discard uncommitted work are snapshotted first, dangerous ones are refused until you grant them</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.edge{fill:none;stroke:#FFFFFF;stroke-opacity:.12}
.plate{fill:#131822;stroke:#FFFFFF;stroke-opacity:.12}
.rule{fill:none;stroke:#FFFFFF;stroke-opacity:.12}
.out{fill:#131822;stroke-opacity:.5}
.t{font-size:20px;font-weight:650;letter-spacing:-.01em;fill:#E8ECF4}
.u{font-size:13.5px;fill:#B4BDCE}
.k{font-size:11px;font-weight:700;letter-spacing:.14em}
.ka{fill:#B4BDCE}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;fill:#E8ECF4}
.h{font-size:15.5px;font-weight:600;fill:#E8ECF4}
.s{font-size:12.5px;fill:#B4BDCE}
.f{font-size:13px;fill:#B4BDCE}
.w{font-size:13px;font-weight:800;letter-spacing:.16em;fill:#E8ECF4;text-anchor:middle}
.pt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#B4BDCE;text-anchor:middle}
.fA{fill:#7AA2FF}.fG{fill:#E5A53A}.fN{fill:#34D399}.fR{fill:#F87171}.fM{fill:#8893A7}
.sG{stroke:#E5A53A}.sN{stroke:#34D399}.sR{stroke:#F87171}.sM{stroke:#8893A7}
.on{fill:none;stroke:#0B0E14;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.halo{fill:none;stroke-opacity:.14;stroke-width:12;stroke-linejoin:round}
.shield{fill-opacity:.14;stroke-width:2;stroke-linejoin:round}
.base{fill:#131822}
.wire{fill:none;stroke-width:1.75;stroke-linecap:round}
</style>
<defs>
<marker id="aM" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="fM" d="M0 1L10 5L0 9L2.6 5z"/></marker>
<marker id="aN" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="fN" d="M0 1L10 5L0 9L2.6 5z"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="fG" d="M0 1L10 5L0 9L2.6 5z"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="fR" d="M0 1L10 5L0 9L2.6 5z"/></marker>
</defs>
<rect fill="#0B0E14" width="880" height="400" rx="16"/>
<rect class="edge" x=".5" y=".5" width="879" height="399" rx="15.5"/>
<text class="k fA" x="32" y="40">THE WARD</text>
<text class="t" x="32" y="66">The Ward reads every command before it runs</text>
<text class="u" x="32" y="88">Fail-closed and built for bypass mode. A speed bump, not a sandbox.</text>
<rect class="plate" x="32.5" y="136.5" width="232" height="164" rx="12"/>
<text class="k ka" x="50" y="166">CLAUDE WANTS TO RUN</text>
<path class="rule" d="M48 210.5H249M48 242.5H249"/>
<circle class="fN" cx="56" cy="194" r="4"/><text class="m" x="70" y="199">pytest -q</text>
<circle class="fG" cx="56" cy="226" r="4"/><text class="m" x="70" y="231">git reset --hard</text>
<circle class="fR" cx="56" cy="258" r="4"/><text class="m" x="70" y="263">rm -rf ~</text>
<path class="wire sM" d="M270 218H312" marker-end="url(#aM)"/>
<path class="halo sG" d="M370 156l50 18v44c0 32-22 50-50 62c-28-12-50-30-50-62v-44z"/>
<path class="base" d="M370 156l50 18v44c0 32-22 50-50 62c-28-12-50-30-50-62v-44z"/>
<path class="shield fG sG" d="M370 156l50 18v44c0 32-22 50-50 62c-28-12-50-30-50-62v-44z"/>
<text class="w" x="370" y="214">WARD</text>
<text class="pt" x="370" y="232">PreToolUse</text>
<path class="wire sN" d="M426 206C454 206 452 148 482 148" marker-end="url(#aN)"/>
<path class="wire sG" d="M426 218H482" marker-end="url(#aG)"/>
<path class="wire sR" d="M426 230C454 230 452 288 482 288" marker-end="url(#aR)"/>
<rect class="out sN" x="484.5" y="118.5" width="363" height="59" rx="12"/>
<circle class="fN" cx="514" cy="148" r="12"/><path class="on" d="M508 148.5l4 4l8-8.5"/>
<text class="h" x="538" y="144">Runs</text>
<text class="s" x="538" y="164">tests, builds, reads, scoped edits</text>
<rect class="out sG" x="484.5" y="188.5" width="363" height="59" rx="12"/>
<circle class="fG" cx="514" cy="218" r="12"/><path class="on" d="M508 214.5h12v8h-12zM511 214.5v-2.5h6v2.5"/>
<text class="h" x="538" y="214">Saves your work, then runs</text>
<text class="s" x="538" y="234">snapshot first; sampo oops brings it back</text>
<rect class="out sR" x="484.5" y="258.5" width="363" height="59" rx="12"/>
<circle class="fR" cx="514" cy="288" r="12"/><path class="on" d="M509 283l10 10M519 283l-10 10"/>
<text class="h" x="538" y="284">Refused, with how to grant it</text>
<text class="s" x="538" y="304">wide deletes, force-push, curl | sh</text>
<path class="rule" d="M32 340.5H848"/>
<text class="f" x="32" y="364">Granting takes your yes in Claude Code's own permission prompt, for that one thing on that one task.</text>
<text class="f" x="32" y="383">Nothing else can grant it: not a chat message, a skill or a scheduled prompt.</text>
</svg>
