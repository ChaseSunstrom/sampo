name: tests

on:
  push:
    paths-ignore:  # T-2090: fm genesis live's data-only pushes; the page's code still runs the suite
      - site/genesis/genesis.json
      - site/genesis/*.md
      - site/genesis/gen-*/**
      - site/genesis/moons-catalogue*.json  # T-3439: the catalogue shards (T-3047); no test reads the committed ones
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.14"]
        shard: [1, 2, 3]  # T-1842: one job took 92-100% of the deadline; halves; T-4687: halves hit it too (run 43677104299), thirds (the run line's divisor below is the same number)
        include:
          - os: macos-latest  # green since 1.2.44 (T-1284); still reported, not blocking, while it settles
            python: "3.14"
            experimental: true
            shard: 1
          - os: macos-latest  # an include that changes os adds one job, so each shard is listed
            python: "3.14"
            experimental: true
            shard: 2
          - os: macos-latest  # T-2560: a half-suite overran macOS's 1980 s deadline at 5657 tests; thirds fit
            python: "3.14"
            experimental: true
            shard: 3
          - os: macos-latest  # T-4633: thirds overran too (run 43581600540: 1992-1996 s, 354 jobs never started); fifths
            python: "3.14"
            experimental: true
            shard: 4
          - os: macos-latest
            python: "3.14"
            experimental: true
            shard: 5
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: ${{ matrix.experimental && 35 || 25 }}  # whole suite: macOS 1980+ s, Ubuntu 1268-1381 s at the halving, over it by T-4687 (a third per shard); fm ci-watch names a shard past 85% of its deadline; keep the suite's --deadline 2 min under
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: git identity for the tests' commits
        run: git config --global user.name CI && git config --global user.email ci@example.invalid
      - name: suite (no claude needed; the e2e roundtrip and hook bench stay local)
        run: python3 plugin/tests/run.py --shard ${{ matrix.shard }}/${{ matrix.experimental && 5 || 3 }} --deadline ${{ matrix.experimental && 1980 || 1380 }} --timeout ${{ matrix.experimental && 900 || 480 }}  # ends below timeout-minutes, naming what was slow (T-1809); macOS 3.14 ran LeanKind 504 s (T-2844)
        env:
          FOREMAN_CHROME: none  # the runner's chromium crashes under the parallel suite; local gates run the browser tests
